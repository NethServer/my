# Third-party application access.
#
# Expected portal visibility is evaluated from the per-app access_control in
# sync/configs/config.yml — organization_ids AND organization_roles AND
# user_roles, fail-closed — AND, for reseller and customer personas, from the
# portal list the owner set on the distributor at the top of their branch
# (fixture.yml third_party_apps: a branch without one sees no portal; the
# distributor's own personas and the owner organization are never restricted
# by it). The result is compared with what my actually offers each persona.
# Nothing here is derived from the backend's filtering code.
#
# The IdP half is a different question. Logto only knows the rule the backend
# pushes for the apps config.yml flags access_control.idp_enforced: the
# ORGANIZATION dimension (owner, admitted distributors, resellers and customers
# whose distributor grants the portal). Logto combines its rules with OR, so the
# user-role dimension cannot be ANDed in and stays a portal-side filter — a
# Reader in an admitted organization is refused the tile, not the sign-in. For
# an app without the flag, Logto enforces nothing: a persona the portal hides
# can still complete SSO by going straight to the app's login URL, and only the
# application's own checks stand in the way.
#
# idp_probe drives a real authorization-code flow per persona per app. That is a
# full interactive login each time, so it is off by default; turn it on when
# changing anything about third-party apps or their idp_enforced flag:
#     ./apitool authz run --layer=apps --idp-probe
# For an idp_enforced app the probe expects Logto to issue a code exactly to
# the organizations of the rule; for the others it records the gap as accepted.

idp_probe: false

apps:
  - name: nethshop.nethesis.it
    note: |
      access_control admits Owner/Distributor/Reseller organizations with
      Owner, Staff, Admin or Backoffice. Resellers also need their distributor
      to grant the portal.

  - name: stock.nethesis.it
    note: |
      The only app that also pins organization_ids, to the Owner organization.
      Note that the id in config.yml (guwy6opsll17) is the one from the
      environment the config was written for, so on any other tenant — including
      a local one — the app is expected to be visible to nobody at all. That is
      the fail-closed behaviour and it is what the suite asserts. With
      idp_enforced the rule pushed to Logto is exactly that organization id.

  - name: my.nethspot.com
    note: Owner/Reseller organizations with Owner, Staff, Admin or Support.

  - name: helpdesk.nethesis.it
    note: |
      The widest of the four: Owner/Distributor/Reseller with Owner, Staff, Admin
      or Support. Customer organizations are excluded, which is the boundary that
      matters here. The fixture leaves it out of d1's portal list, so d1r1's
      personas must not see it while d1's own do.

  - name: formazione.nethesis.it
    note: |
      Owner/Distributor/Reseller organizations with every technical role but
      Reader, the same pair as the partner forum. Customer organizations are
      the boundary that matters.

      Moodle also checks on its side: its auth_nethesis_sso plugin reads both
      organization_roles and roles off the token and refuses anything these two
      lists do not name, before an account exists, so unlike the other four this
      app does not rely on the portal alone. Its own settings mirror the lists
      written here and have to be changed with them.

  - name: partner.nethesis.it
    note: |
      Owner/Distributor/Reseller organizations with every technical role but
      Reader. The forum enforces nothing on the token: without idp_enforced the
      portal filter is the only gate.
