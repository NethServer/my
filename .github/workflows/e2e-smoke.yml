name: E2E - QA Smoke

# A handful of read-only checks against the deployed QA environment after it
# picks up a merge.
#
# This catches the one class of failure the full-stack job structurally cannot
# see: that job builds its own stack from the checkout with its own
# configuration, so a wrong variable in render.yaml, a missing Logto redirect
# URI, a proxy route that differs from nginx.conf.local or a stale image tag
# are all invisible there.
#
# Read-only by construction: QA shares a database and a Logto tenant with real
# users, so nothing here creates, edits or deletes anything.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: e2e-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: QA smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      E2E_SMOKE_BASE_URL: https://qa.my.nethesis.it

    steps:
    - uses: actions/checkout@v7
      with:
        # The wait step diffs this push against the previous head of main.
        fetch-depth: 0

    - name: Wait for QA to serve this commit
      id: deployed
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -uo pipefail

        # QA is deployed by Render on push, not by Actions, so there is no
        # workflow to depend on. The health endpoint cannot be used to identify
        # the build either: Render builds from source (render.yaml sets
        # runtime: docker) and nothing passes COMMIT, so /backend/api/health
        # reports commit "unknown" for ever. Ask Render instead.
        #
        # Render auto-deploys a service only when the push changes a file
        # under its rootDir. A frontend-only merge redeploys my-frontend-qa and
        # leaves every other QA service on its current build, so waiting for
        # one fixed service to deploy this commit can wait for ever. Wait
        # instead for a live deploy of this commit on every service whose
        # rootDir the push touched, and for any deploy still in flight on the
        # others to settle.
        if [ -z "${RENDER_API_KEY:-}" ]; then
          echo "::warning::RENDER_API_KEY is not set, cannot confirm which build QA is serving. Skipping."
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        API="https://api.render.com/v1"
        AUTH="Authorization: Bearer ${RENDER_API_KEY}"

        # workflow_dispatch has no previous head: nothing is expected to
        # deploy, only in-flight deploys are waited for.
        CHANGED=""
        if [ -n "${BEFORE_SHA:-}" ] && ! CHANGED=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" 2>/dev/null); then
          echo "::warning::Cannot diff ${BEFORE_SHA}..${GITHUB_SHA}; expecting every QA service to deploy this commit."
          CHANGED="*"
        fi

        LISTED=0
        SERVICES=()
        while read -r NAME ROOT_DIR; do
          LISTED=$(( LISTED + 1 ))
          read -r ID SUSPENDED < <(curl -s -G -H "$AUTH" "${API}/services" \
            --data-urlencode "name=${NAME}" --data "limit=20" \
            | jq -r --arg n "$NAME" 'first(.[] | select(.service.name == $n) | .service | .id + " " + .suspended) // empty')
          if [ -z "${ID:-}" ]; then
            echo "::warning::No Render service named ${NAME}. Skipping the smoke run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Render skips autodeploy on a suspended service, so waiting for one
          # can only time out. my-mimir-qa stays suspended to save money and
          # the suite does not need it. A suspended service the suite does need
          # still shows: the backend through the health check below, the rest
          # through the suite itself.
          if [ "$SUSPENDED" = "suspended" ]; then
            echo "${NAME} (${ROOT_DIR}/): suspended, not waited for"
            continue
          fi
          EXPECTED=0
          if [ "$CHANGED" = "*" ] || grep -q "^${ROOT_DIR}/" <<<"$CHANGED"; then
            EXPECTED=1
          fi
          echo "${NAME} (${ROOT_DIR}/): $([ "$EXPECTED" = 1 ] && echo "expects a deploy of ${GITHUB_SHA}" || echo "unchanged")"
          SERVICES+=("${NAME} ${ID} ${EXPECTED}")
        done < <(yq -r '.services[] | select(.name | test("-qa$")) | select(.rootDir) | .name + " " + .rootDir' render.yaml)

        if [ "$LISTED" -eq 0 ]; then
          echo "::error::render.yaml lists no QA service with a rootDir."
          exit 1
        fi

        # Poll every 30s for at most 18 minutes. The job timeout is 30 minutes:
        # the remainder covers the browser install and the suite, and an
        # environment that never comes up ends in the warning below rather
        # than in a cancellation.
        POLL_SECONDS=30
        MAX_ATTEMPTS=$(( 18 * 60 / POLL_SECONDS ))
        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          PENDING=()
          for entry in "${SERVICES[@]}"; do
            read -r NAME ID EXPECTED <<<"$entry"
            DEPLOYS=$(curl -s -H "$AUTH" "${API}/services/${ID}/deploys?limit=20")
            if [ "$EXPECTED" = 1 ]; then
              STATUS=$(jq -r --arg sha "$GITHUB_SHA" \
                'first(.[] | select(.deploy.commit.id == $sha) | .deploy.status) // "not started"' <<<"$DEPLOYS")
            else
              STATUS=$(jq -r 'first(.[] | .deploy.status) // "live"' <<<"$DEPLOYS")
              case "$STATUS" in
                created|queued|*_in_progress) ;;
                *) STATUS=live ;;
              esac
            fi

            case "$STATUS" in
              live) ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::Render deploy of ${GITHUB_SHA} on ${NAME} ended as '${STATUS}'."
                exit 1
                ;;
              *) PENDING+=("${NAME}: ${STATUS}") ;;
            esac
          done

          if [ "${#PENDING[@]}" -eq 0 ]; then
            # Render reports "live" the moment the instance accepts traffic;
            # make sure it really answers before asserting.
            if curl -fsS -o /dev/null --max-time 10 "${E2E_SMOKE_BASE_URL}/backend/api/health"; then
              echo "QA is serving ${GITHUB_SHA}"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PENDING+=("backend health check not answering")
          fi

          SUMMARY=$(printf '%s, ' "${PENDING[@]}")
          echo "attempt ${attempt}: waiting for ${SUMMARY%, }"
          sleep "$POLL_SECONDS"
        done

        # Not a failure. The qa-office-hours cron job on Render suspends the QA
        # services outside Mon-Fri 08:00-22:00 Europe/Rome, so an environment
        # that never comes up is usually asleep — reporting that as a
        # regression would train people to ignore this workflow.
        echo "::warning::QA never came up for ${GITHUB_SHA}; it may be suspended. Skipping the smoke run."
        echo "ready=false" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      if: steps.deployed.outputs.ready == 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install browser suite dependencies
      if: steps.deployed.outputs.ready == 'true'
      working-directory: frontend
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run the smoke suite
      if: steps.deployed.outputs.ready == 'true'
      working-directory: frontend
      env:
        # The dedicated account for this environment. Without it the
        # authenticated checks skip and only the public surface is covered.
        E2E_SMOKE_EMAIL: ${{ secrets.E2E_SMOKE_EMAIL }}
        E2E_SMOKE_PASSWORD: ${{ secrets.E2E_SMOKE_PASSWORD }}
      run: npx playwright test -c playwright.config.smoke.ts

    # The repository is public, so the artifact is readable by anyone signed
    # in to GitHub.
    - name: Check the report carries no password
      id: redaction
      if: always() && steps.deployed.outputs.ready == 'true'
      working-directory: frontend
      env:
        E2E_SMOKE_PASSWORD: ${{ secrets.E2E_SMOKE_PASSWORD }}
      run: bash e2e/check-no-passwords.sh

    - name: Upload report, screenshots, video and traces
      if: always() && steps.redaction.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: playwright-smoke-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        retention-days: 30
