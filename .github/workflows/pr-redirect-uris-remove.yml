name: PR - Remove Redirect URIs from Logto

# pull_request_target: a PR closed and deleted in the same breath has no merge
# ref, so a plain pull_request workflow never gets a run.
on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-redirect-uris:
    runs-on: ubuntu-latest
    steps:
      - name: Extract PR number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Get Logto access token
        id: logto-token
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.LOGTO_BASE_URL }}/oidc/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.LOGTO_M2M_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.LOGTO_M2M_CLIENT_SECRET }}" \
            -d "resource=${{ secrets.LOGTO_BASE_URL }}/api" \
            -d "scope=all")

          ACCESS_TOKEN=$(echo $RESPONSE | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Get current application configuration
        id: current-config
        run: |
          RESPONSE=$(curl -s -X GET "${{ secrets.LOGTO_BASE_URL }}/api/applications/${{ secrets.LOGTO_FRONTEND_APP_ID }}" \
            -H "Authorization: Bearer ${{ steps.logto-token.outputs.token }}" \
            -H "Content-Type: application/json")

          echo "current_config<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: List open pull requests
        id: open-prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_PRS=$(gh pr list --repo "${{ github.repository }}" --state open --limit 500 --json number --jq '[.[].number]')
          echo "Open pull requests: $OPEN_PRS"
          echo "numbers=$OPEN_PRS" >> $GITHUB_OUTPUT

      - name: Remove redirect URIs
        id: remove
        run: |
          # Extract current redirect URIs
          CURRENT_REDIRECT_URIS=$(echo '${{ steps.current-config.outputs.current_config }}' | jq -r '.oidcClientMetadata.redirectUris // []')
          CURRENT_POST_LOGOUT_URIS=$(echo '${{ steps.current-config.outputs.current_config }}' | jq -r '.oidcClientMetadata.postLogoutRedirectUris // []')
          OPEN_PRS='${{ steps.open-prs.outputs.numbers }}'

          # Keep every non-preview URI plus the previews of PRs still open: this
          # drops the closed PR and any leftover of a removal that never ran.
          KEEP_OPEN='def pr: [capture("^https://my-proxy-qa-pr-(?<n>[0-9]+)\\.onrender\\.com/").n | tonumber][0];
            map(select(pr as $n | $n == null or any($open[]; . == $n)))'
          UPDATED_REDIRECT_URIS=$(echo "$CURRENT_REDIRECT_URIS" | jq --argjson open "$OPEN_PRS" "$KEEP_OPEN")
          UPDATED_POST_LOGOUT_URIS=$(echo "$CURRENT_POST_LOGOUT_URIS" | jq --argjson open "$OPEN_PRS" "$KEEP_OPEN")

          REMOVED=$(jq -n -c \
            --argjson a "$CURRENT_REDIRECT_URIS" --argjson b "$UPDATED_REDIRECT_URIS" \
            --argjson c "$CURRENT_POST_LOGOUT_URIS" --argjson d "$UPDATED_POST_LOGOUT_URIS" \
            '($a - $b) + ($c - $d)')
          echo "removed=$REMOVED" >> $GITHUB_OUTPUT

          if [ "$(echo "$REMOVED" | jq 'length')" -eq 0 ]; then
            echo "ℹ️ No redirect URIs to remove for PR #${{ steps.pr.outputs.number }}"
            exit 0
          fi

          # Create the request body
          REQUEST_BODY=$(jq -n \
            --argjson redirectUris "$UPDATED_REDIRECT_URIS" \
            --argjson postLogoutRedirectUris "$UPDATED_POST_LOGOUT_URIS" \
            '{
              oidcClientMetadata: {
                redirectUris: $redirectUris,
                postLogoutRedirectUris: $postLogoutRedirectUris
              }
            }')

          echo "Request body:"
          echo "$REQUEST_BODY" | jq .

          # Update the application
          RESPONSE=$(curl -s -X PATCH "${{ secrets.LOGTO_BASE_URL }}/api/applications/${{ secrets.LOGTO_FRONTEND_APP_ID }}" \
            -H "Authorization: Bearer ${{ steps.logto-token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          echo "Update response:"
          echo "$RESPONSE" | jq .

          # Check if the update was successful
          if echo "$RESPONSE" | jq -e '.oidcClientMetadata.redirectUris' > /dev/null; then
            echo "✅ Successfully removed redirect URIs:"
            echo "$REMOVED" | jq -r '.[] | "- " + .'
          else
            echo "❌ Failed to update redirect URIs"
            echo "Response: $RESPONSE"
            exit 1
          fi

      - name: Comment on PR
        if: steps.remove.outputs.removed != '[]'
        uses: actions/github-script@v7
        env:
          REMOVED: ${{ steps.remove.outputs.removed }}
        with:
          script: |
            const prNumber = '${{ steps.pr.outputs.number }}';
            const removed = JSON.parse(process.env.REMOVED);

            const body = [
              '🗑️ **Redirect URIs Removed from Logto**',
              '',
              'The following redirect URIs have been automatically removed from the Logto application configuration:',
              '',
              ...removed.map(uri => `- \`${uri}\``),
              '',
              `Cleanup completed for PR #${prNumber}.`
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
