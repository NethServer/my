# Mirrors the production nginx.conf worker sizing so a local restart
# exercises the same events block; see the comment there for the why.
worker_processes 2;
worker_rlimit_nofile 32768;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Redact token= and ticket= query values from the access log. Each map
    # redacts the last occurrence not yet redacted; four passes cover a
    # repeated parameter.
    map $request_uri $redacted_uri_1 {
        "~^(?<rhead>[^?]*\?.*(?:token|ticket)=)(?!\[REDACTED\])[^&]*(?<rtail>.*)$" "${rhead}[REDACTED]${rtail}";
        default $request_uri;
    }
    map $redacted_uri_1 $redacted_uri_2 {
        "~^(?<rhead>[^?]*\?.*(?:token|ticket)=)(?!\[REDACTED\])[^&]*(?<rtail>.*)$" "${rhead}[REDACTED]${rtail}";
        default $redacted_uri_1;
    }
    map $redacted_uri_2 $redacted_uri_3 {
        "~^(?<rhead>[^?]*\?.*(?:token|ticket)=)(?!\[REDACTED\])[^&]*(?<rtail>.*)$" "${rhead}[REDACTED]${rtail}";
        default $redacted_uri_2;
    }
    map $redacted_uri_3 $sanitized_request_uri {
        "~^(?<rhead>[^?]*\?.*(?:token|ticket)=)(?!\[REDACTED\])[^&]*(?<rtail>.*)$" "${rhead}[REDACTED]${rtail}";
        default $redacted_uri_3;
    }

    log_format main '$remote_addr [$time_local] "$request_method $sanitized_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # SSL certificates (mkcert)
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Support subdomain proxy — *.support.my.localtest.me
    server {
        listen 443 ssl;
        server_name ~^.+\.support\..*;

        add_header X-Content-Type-Options "nosniff" always;

        location / {
            rewrite ^(.*)$ /support-proxy$1 break;

            proxy_pass http://host.containers.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Long timeouts for support sessions
            proxy_connect_timeout 24h;
            proxy_send_timeout 24h;
            proxy_read_timeout 24h;
        }
    }

    # Main app — my.localtest.me
    server {
        listen 443 ssl default_server;
        server_name _;

        # Security headers (dev mirror of proxy/nginx.conf so CSP breakage
        # shows up locally first; main-app server only, the *.support.*
        # server above proxies third-party UIs). Differences from the
        # deployed policy: wildcard *.logto.app (dev tenants) and ws: in
        # connect-src for the Vite HMR socket; the Kapa AI widget origins
        # (prod-only in the deployed policy) so it can be tried locally with
        # VITE_KAPA_WEBSITE_ID. No HSTS: localtest.me only.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://widget.kapa.ai https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.logto.app https://id.nethesis.it https://qa.id.nethesis.it https://www.google.com https://*.gstatic.com; font-src 'self' data:; connect-src 'self' ws: https://*.logto.app https://id.nethesis.it https://qa.id.nethesis.it https://nethshop2.nethesis.it https://my.staging.nethspot.com https://formazione.nethesis.it https://proxy.kapa.ai https://metrics.kapa.ai https://www.google.com; frame-src 'self' https://www.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://*.logto.app https://id.nethesis.it https://qa.id.nethesis.it" always;

        # Support terminal WebSocket: the only API route that needs the
        # upgrade and long timeouts.
        location ~ ^/api/support-sessions/[^/]+/terminal$ {
            proxy_pass http://host.containers.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_send_timeout 24h;
            proxy_read_timeout 24h;
        }

        # Backend API
        location /api/ {
            proxy_pass http://host.containers.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Frontend (Vite dev server)
        location / {
            proxy_pass http://host.containers.internal:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            # WebSocket support (Vite HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
